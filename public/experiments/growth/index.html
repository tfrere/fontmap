<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sixteen years of Google Fonts · FontMap experiment</title>
  <meta name="description" content="How the Google Fonts catalogue filled the map, year by year, from 2010 to today." />
  <link rel="icon" href="../../fontmap-icon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/experiment.css" />
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('fontmap-dark-mode') === 'true' ? 'dark' : 'light';
  </script>
</head>
<body>
  <canvas id="map" aria-label="Map of Google Fonts filling up by year added"></canvas>

  <nav class="topbar" aria-label="Navigation">
    <a class="back" href="../" title="Back to all experiments"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg><span>All experiments</span></a>
    <a class="topbar-brand" href="../../" title="Open the map">FontMap</a>
  </nav>

  <aside class="panel" aria-live="polite">
    <h1>Sixteen years of Google Fonts</h1>
    <p class="lede">
      The map fills up in the order Google added each font. The year's additions are in black; older ones fade back.
    </p>

    <p class="year" id="year"></p>
    <dl class="stats" id="stats"></dl>

    <div class="histogram" id="histogram" aria-label="Fonts added per year"></div>
    <div class="histogram-axis" id="histogram-axis"></div>

    <div class="scale">
      <input id="time" type="range" step="0.001" aria-label="Date" />
    </div>

    <div class="actions">
      <button type="button" id="play" title="Play / pause (Space)">Pause</button>
      <label class="check"><input type="checkbox" id="names" checked /> Names</label>
      <button type="button" id="download" title="Download a 4K PNG of the map at this date">PNG</button>
      <button type="button" id="theme" class="icon" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>

    <p class="source" id="source"></p>
    <a class="next" href="../designers/index.html"><span>Next experiment</span>Who drew the fonts you know? →</a>
  </aside>

  <div class="hint">Scroll to zoom · drag to pan · double-click to reset · click a glyph to open it</div>

  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <div class="loader" id="loader"><div class="spinner"></div></div>

  <script type="module" src="main.js"></script>
</body>
</html>
